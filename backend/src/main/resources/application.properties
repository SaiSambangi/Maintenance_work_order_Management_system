# ================================================================
# Application Configuration
# ================================================================
# This file configures database connection, JPA, and server settings.
# DO NOT commit real passwords - use environment variables in production.
# ================================================================

spring.application.name=workorder-management

# ----------------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# MySQL Database Connection
# Configured via environment variables with sensible local defaults:
# - DB_URL / SPRING_DATASOURCE_URL
# - DB_USER / SPRING_DATASOURCE_USERNAME
# - DB_PASSWORD / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maintenance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------
# update: Hibernate will automatically create/update tables based on entities
# CAUTION: use 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ----------------------------------------------------------------
# Jackson (JSON) Configuration
# ----------------------------------------------------------------
# Serialize Java enums as their string names, not ordinal numbers
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
